# Test/staging environment overrides
environment: test

# Test mirrors prod but with reduced resources
frontend:
  replicas: 2
  resources:
    requests:
      memory: "192Mi"
      cpu: "100m"
    limits:
      memory: "384Mi"
      cpu: "150m"

userService:
  replicas: 2
  resources:
    requests:
      memory: "192Mi"
      cpu: "100m"
    limits:
      memory: "384Mi"
      cpu: "150m"

transactionService:
  replicas: 2
  resources:
    requests:
      memory: "384Mi"
      cpu: "150m"
    limits:
      memory: "512Mi"
      cpu: "250m"

activityService:
  replicas: 2
  resources:
    requests:
      memory: "192Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "100m"

postgres:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    storageClassName: gp2
    size: 10Gi

redis:
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

kafka:
  replicas: 1
  resources:
    requests:
      memory: "768Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "500m"

ingress:
  enabled: true
  className: nginx
  host: ""
  tls:
    enabled: false
    secretName: ""

secrets:
  postgresDb: bankingdb
  postgresUser: bankuser
  postgresPassword: bankpass
  nodeEnv: test

configmap:
  springJpaHibernateDdlAuto: "update"
  frontendOrigin: "https://placeholder.elb.amazonaws.com"
  bankFrontend: "https://placeholder.elb.amazonaws.com"

datadog:
  enabled: true
  apiKey: ""
  appKey: ""