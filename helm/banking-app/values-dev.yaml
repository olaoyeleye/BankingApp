# Development environment overrides
environment: dev

frontend:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "100m"

userService:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "100m"

transactionService:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

activityService:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"
      cpu: "50m"

postgres:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  persistence:
    enabled: true
    storageClassName: gp2
    size: 5Gi




redis:
  replicas: 1
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "50m"

kafka:
  replicas: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

ingress:
  enabled: true
  className: nginx
  host: ""
  tls:
    enabled: false
    secretName: ""

secrets:
  postgresDb: bankingdb
  postgresUser: bankuser
  postgresPassword: bankpass
  nodeEnv: development

configmap:
  springJpaHibernateDdlAuto: "update"
  frontendOrigin: "https://placeholder.elb.amazonaws.com"
  bankFrontend: "https://placeholder.elb.amazonaws.com"

datadog:
  enabled: false