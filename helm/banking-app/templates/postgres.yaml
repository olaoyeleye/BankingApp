{{- if .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: {{ include "banking-app.namespace" . }}
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: {{ .Values.postgres.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: {{ include "banking-app.namespace" . }}
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS users (id VARCHAR(50) PRIMARY KEY, full_name VARCHAR(100) NOT NULL, email VARCHAR(120) UNIQUE NOT NULL, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);
    CREATE TABLE IF NOT EXISTS accounts (user_id VARCHAR(50) PRIMARY KEY, balance NUMERIC(12,2) NOT NULL DEFAULT 0, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);
    CREATE TABLE IF NOT EXISTS transactions (id SERIAL PRIMARY KEY, user_id VARCHAR(50) NOT NULL, transaction_type VARCHAR(30) NOT NULL, amount NUMERIC(12,2) NOT NULL, reference VARCHAR(100), created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);
    CREATE TABLE IF NOT EXISTS activities (id SERIAL PRIMARY KEY, user_id VARCHAR(50) NOT NULL, activity_type VARCHAR(50) NOT NULL, description TEXT NOT NULL, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ include "banking-app.namespace" . }}
  labels:
    app: postgres
spec:
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: "{{ .Values.ecrRegistry }}/{{ .Values.postgres.image.repository }}:{{ .Values.imageTag }}"
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "{{ .Values.postgres.resources.requests.memory }}"
            cpu: "{{ .Values.postgres.resources.requests.cpu }}"
          limits:
            memory: "{{ .Values.postgres.resources.limits.memory }}"
            cpu: "{{ .Values.postgres.resources.limits.cpu }}"
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-sql
        configMap:
          name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: {{ include "banking-app.namespace" . }}
spec:
  selector:
    app: postgres
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: 5432
  type: ClusterIP