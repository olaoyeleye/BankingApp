apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress-nginx
  namespace: banking
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - techbleatbank.duckdns.org
    secretName: techbleatbank-tls
  rules:
  - host: techbleatbank.duckdns.org
    http:
      paths:
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8000
          - path: /transactions
            pathType: Prefix
            backend:
              service:
                name: transaction-service
                port:
                  number: 8080
          - path: /activities
            pathType: Prefix
            backend:
              service:
                name: activity-service
                port:
                  number: 8001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bank-frontend
                port:
                  number: 3000