name: 3. Destroy

on:
  push:
    branches: [ "dev", "test", "prod" ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Application environment to destroy (dev/test/prod)"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-provision
  cancel-in-progress: false

jobs:
  destroy-app:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'destroy') }}
    environment: ${{ github.event.inputs.environment || github.ref_name }}
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Detect environment
        id: env
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="${GITHUB_REF##*/}"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check if EKS cluster exists
        id: cluster-check
        shell: bash
        run: |
          CLUSTER_NAME="${{ secrets.VPC_NAME }}-${{ steps.env.outputs.environment }}-cluster"
          REGION="${{ secrets.AWS_REGION }}"
          if aws eks describe-cluster --name "$CLUSTER_NAME" --region "$REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "EKS cluster found."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "EKS cluster not found - nothing to destroy."
          fi

      - name: Install kubectl and Helm
        if: steps.cluster-check.outputs.exists == 'true'
        shell: bash
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Update kubeconfig for EKS
        if: steps.cluster-check.outputs.exists == 'true'
        shell: bash
        run: aws eks update-kubeconfig --name "${{ secrets.VPC_NAME }}-${{ steps.env.outputs.environment }}-cluster" --region "${{ secrets.AWS_REGION }}"

      - name: Uninstall Helm release
        if: steps.cluster-check.outputs.exists == 'true'
        shell: bash
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          NAMESPACE="banking-${ENV}"
          echo "Uninstalling banking-app from namespace: $NAMESPACE"
          helm uninstall banking-app -n "$NAMESPACE" --ignore-not-found || true
          kubectl delete namespace "$NAMESPACE" --ignore-not-found || true
          echo "Application environment '$ENV' destroyed."

      - name: Skip - cluster not found
        if: steps.cluster-check.outputs.exists == 'false'
        shell: bash
        run: echo "Nothing to destroy - EKS cluster does not exist. App destroy complete."

  destroy-infra:
    needs: destroy-app
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'destroy') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || github.ref_name }}
    steps:
      - name: Detect environment
        id: env
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="${GITHUB_REF##*/}"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create terraform.tfvars
        working-directory: ./terraform
        shell: bash
        run: |
          cat > terraform.tfvars <<EOF
          region              = "${{ secrets.AWS_REGION }}"
          ami                 = "${{ secrets.AMI_ID }}"
          instance_type       = "${{ secrets.INSTANCE_TYPE }}"
          instance-name-nginx = "${{ secrets.INSTANCE_NAME_NGINX }}"
          vpc_name            = "${{ secrets.VPC_NAME }}"
          key_name            = "${{ secrets.KEY_NAME }}"
          environment         = "${{ steps.env.outputs.environment }}"
          EOF

      - name: Download AWS Load Balancer Controller IAM Policy
        working-directory: ./terraform
        shell: bash
        run: |
          curl -Lo iam_policy.json https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/main/docs/install/iam_policy.json

      - name: Terraform Init
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: terraform init -reconfigure -backend-config="key=banking-app/${{ steps.env.outputs.environment }}/terraform.tfstate"

      - name: Install kubectl and Helm
        shell: bash
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Update kubeconfig for EKS
        shell: bash
        run: aws eks update-kubeconfig --name "${{ secrets.VPC_NAME }}-${{ steps.env.outputs.environment }}-cluster" --region "${{ secrets.AWS_REGION }}" || true

      - name: Remove Kubernetes resources and Helm releases
        shell: bash
        run: |
          kubectl delete ingress --all -A --ignore-not-found || true
          kubectl delete svc --all -A --field-selector spec.type=LoadBalancer --ignore-not-found || true
          ENV="${{ steps.env.outputs.environment }}"
          kubectl delete ns "banking-${ENV}" --ignore-not-found || true
          kubectl delete ns ingress-nginx datadog --ignore-not-found || true
          helm uninstall ingress-nginx -n ingress-nginx --ignore-not-found || true
          helm uninstall datadog-operator -n datadog --ignore-not-found || true
          sleep 60

      - name: Delete EKS node groups
        shell: bash
        run: |
          CLUSTER_NAME="${{ secrets.VPC_NAME }}-${{ steps.env.outputs.environment }}-cluster"
          REGION="${{ secrets.AWS_REGION }}"
          if aws eks describe-cluster --name "$CLUSTER_NAME" --region "$REGION" >/dev/null 2>&1; then
            NODEGROUPS=$(aws eks list-nodegroups --cluster-name "$CLUSTER_NAME" --region "$REGION" --query 'nodegroups[]' --output text)
            if [ -n "${NODEGROUPS// /}" ]; then
              for NG in $NODEGROUPS; do
                echo "Deleting node group: $NG"
                aws eks delete-nodegroup --cluster-name "$CLUSTER_NAME" --nodegroup-name "$NG" --region "$REGION" || true
                aws eks wait nodegroup-deleted --cluster-name "$CLUSTER_NAME" --nodegroup-name "$NG" --region "$REGION" || true
              done
            fi
          fi

      - name: Delete EKS add-ons
        shell: bash
        run: |
          aws eks delete-addon --cluster-name "${{ secrets.VPC_NAME }}-${{ steps.env.outputs.environment }}-cluster" --addon-name aws-ebs-csi-driver --region "${{ secrets.AWS_REGION }}" || true
          aws eks wait addon-deleted --cluster-name "${{ secrets.VPC_NAME }}-${{ steps.env.outputs.environment }}-cluster" --addon-name aws-ebs-csi-driver --region "${{ secrets.AWS_REGION }}" || true

      - name: Terraform Plan Destroy
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        shell: bash
        run: terraform state rm aws_iam_openid_connect_provider.eks || true



      - name: Terraform Plan Destroy
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        shell: bash
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Terraform Destroy
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: terraform apply -auto-approve destroy.tfplan