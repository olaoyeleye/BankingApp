name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        type: choice
        options:
          - test
          - dev
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    runs-on: ubuntu-latest
    # Even destroy requires approval for prod environment
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment config
        id: config
        shell: bash
        run: |
          ENV="${{ github.event.inputs.environment }}"
          STATE_KEY="banking-app/${ENV}/terraform.tfstate"
          CLUSTER_NAME="${{ secrets.VPC_NAME }}-${ENV}-cluster"
          echo "state_key=$STATE_KEY" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "Destroying environment: $ENV"
          echo "Cluster: $CLUSTER_NAME"
          echo "State key: $STATE_KEY"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        shell: bash
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create terraform.tfvars
        working-directory: ./terraform
        shell: bash
        run: |
          cat > terraform.tfvars <<EOF
          region              = "${{ secrets.AWS_REGION }}"
          environment         = "${{ github.event.inputs.environment }}"
          ami                 = "${{ secrets.AMI_ID }}"
          instance_type       = "${{ secrets.INSTANCE_TYPE }}"
          instance-name-nginx = "${{ secrets.INSTANCE_NAME_NGINX }}"
          vpc_name            = "${{ secrets.VPC_NAME }}"
          key_name            = "${{ secrets.KEY_NAME }}"
          EOF

      - name: Download AWS Load Balancer Controller IAM Policy
        working-directory: ./terraform
        shell: bash
        run: |
          curl -Lo iam_policy.json https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/main/docs/install/iam_policy.json

      - name: Terraform Init
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: terraform init -reconfigure -backend-config="key=${{ steps.config.outputs.state_key }}"

      - name: Install kubectl and Helm
        shell: bash
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Update kubeconfig for EKS
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.config.outputs.cluster_name }}" \
            --region "${{ secrets.AWS_REGION }}" || true

      - name: Remove ALB, ingress, and Kubernetes resources
        shell: bash
        run: |
          kubectl delete ingress --all -A --ignore-not-found || true
          kubectl delete svc --all -A --field-selector spec.type=LoadBalancer --ignore-not-found || true
          kubectl delete ns banking ingress-nginx --ignore-not-found || true
          helm uninstall aws-load-balancer-controller -n kube-system --ignore-not-found || true
          helm uninstall aws-ebs-csi-driver -n kube-system --ignore-not-found || true
          helm uninstall ingress-nginx -n ingress-nginx --ignore-not-found || true
          sleep 60

      - name: Delete EKS node groups
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER_NAME="${{ steps.config.outputs.cluster_name }}"
          REGION="${{ secrets.AWS_REGION }}"

          if aws eks describe-cluster --name "$CLUSTER_NAME" --region "$REGION" >/dev/null 2>&1; then
            NODEGROUPS=$(aws eks list-nodegroups \
              --cluster-name "$CLUSTER_NAME" \
              --region "$REGION" \
              --query 'nodegroups[]' \
              --output text)

            if [ -n "${NODEGROUPS// /}" ]; then
              for NG in $NODEGROUPS; do
                echo "Deleting node group: $NG"
                aws eks delete-nodegroup \
                  --cluster-name "$CLUSTER_NAME" \
                  --nodegroup-name "$NG" \
                  --region "$REGION" || true

                aws eks wait nodegroup-deleted \
                  --cluster-name "$CLUSTER_NAME" \
                  --nodegroup-name "$NG" \
                  --region "$REGION" || true
              done
            fi
          fi

      - name: Delete EKS add-ons
        shell: bash
        run: |
          aws eks delete-addon \
            --cluster-name "${{ steps.config.outputs.cluster_name }}" \
            --addon-name aws-ebs-csi-driver \
            --region "${{ secrets.AWS_REGION }}" || true

          aws eks wait addon-deleted \
            --cluster-name "${{ steps.config.outputs.cluster_name }}" \
            --addon-name aws-ebs-csi-driver \
            --region "${{ secrets.AWS_REGION }}" || true

      - name: Remove Terraform state for manually deleted resources
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform state rm aws_security_group.public_kunle_sg || true
          terraform state rm aws_eks_node_group.main || true
          terraform state rm aws_eks_cluster.main || true
          terraform state rm kubernetes_namespace_v1.banking || true
          terraform state rm kubernetes_namespace_v1.ingress_nginx || true
          terraform state rm kubernetes_service_v1.bank_frontend || true
          terraform state rm kubernetes_ingress_v1.bank_frontend || true
          terraform state rm helm_release.ebs_csi_driver || true
          terraform state rm helm_release.ingress_nginx || true
          terraform state rm aws_iam_policy.aws_load_balancer_controller || true
          terraform state rm aws_iam_role.aws_load_balancer_controller || true
          terraform state rm helm_release.aws_load_balancer_controller || true

      - name: Terraform Plan Destroy
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        shell: bash
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Terraform Destroy
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: terraform apply -auto-approve destroy.tfplan