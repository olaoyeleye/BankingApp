name: 1. Provision Infrastructure

on:
  push:
    branches: [ "dev", "test", "prod" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write



concurrency:
  group: infra-provision
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    # Skip when commit message contains [destroy]
    if: ${{ !contains(github.event.head_commit.message, 'destroy') }}
    steps:
      - name: Detect environment
        id: env
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="${GITHUB_REF##*/}"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create terraform.tfvars
        working-directory: ./terraform
        shell: bash
        run: |
          cat > terraform.tfvars <<EOF
          region              = "${{ secrets.AWS_REGION }}"
          ami                 = "${{ secrets.AMI_ID }}"
          instance_type       = "${{ secrets.INSTANCE_TYPE }}"
          instance-name-nginx = "${{ secrets.INSTANCE_NAME_NGINX }}"
          vpc_name            = "${{ secrets.VPC_NAME }}"
          key_name            = "${{ secrets.KEY_NAME }}"
          environment         = "${{ steps.env.outputs.environment }}"
          EOF

      - name: Terraform Init
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: terraform init -reconfigure -backend-config="key=banking-app/${{ steps.env.outputs.environment }}/terraform.tfstate"

      - name: Download AWS Load Balancer Controller IAM Policy
        working-directory: ./terraform
        shell: bash
        run: |
          curl -Lo iam_policy.json https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/main/docs/install/iam_policy.json

      # ─────────────────────────────────────────────────────────────────────
      # FRESH CLUSTER: Destroy any existing infrastructure before applying.
      # This step tears down cluster, nodegroups, addons, IAM roles, and
      # any orphaned AWS resources so every run starts from a clean slate.
      # ─────────────────────────────────────────────────────────────────────
      - name: Destroy existing infrastructure (fresh cluster)
        working-directory: ./terraform
        shell: bash
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: |
          set +e  # never fail the job — "nothing to destroy" is fine
          VPC="${{ secrets.VPC_NAME }}"
          ENV="${{ steps.env.outputs.environment }}"
          CLUSTER="$VPC-$ENV-cluster"
          REGION="${{ secrets.AWS_REGION }}"

          echo "=== Checking for existing cluster: $CLUSTER ==="
          if ! aws eks describe-cluster --name "$CLUSTER" --region "$REGION" >/dev/null 2>&1; then
            echo "Cluster $CLUSTER does not exist — nothing to destroy."
          else
            echo "Cluster found. Proceeding with full teardown."

            # Install kubectl and Helm for k8s-level cleanup
            echo "=== Installing kubectl and Helm ==="
            curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

            echo "=== Updating kubeconfig ==="
            aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION" || true

            echo "=== Removing Kubernetes resources (ingresses, LoadBalancers, Helm releases) ==="
            ENV_NS="banking-$ENV"
            helm uninstall banking-app -n "$ENV_NS" --ignore-not-found || true
            helm uninstall ingress-nginx -n ingress-nginx --ignore-not-found || true
            helm uninstall datadog-operator -n datadog --ignore-not-found || true
            kubectl delete ingress --all -A --ignore-not-found || true
            kubectl delete svc --all -A --field-selector spec.type=LoadBalancer --ignore-not-found || true
            kubectl delete namespace "$ENV_NS" --ignore-not-found || true
            kubectl delete namespace ingress-nginx datadog --ignore-not-found || true
            echo "Waiting 60s for LoadBalancers to deprovision..."
            sleep 60

            echo "=== Deleting EKS add-ons ==="
            aws eks delete-addon --cluster-name "$CLUSTER" --addon-name aws-ebs-csi-driver --region "$REGION" || true
            aws eks wait addon-deleted --cluster-name "$CLUSTER" --addon-name aws-ebs-csi-driver --region "$REGION" || true

            echo "=== Deleting EKS node groups ==="
            NODEGROUPS=$(aws eks list-nodegroups --cluster-name "$CLUSTER" --region "$REGION" --query 'nodegroups[]' --output text 2>/dev/null)
            if [ -n "${NODEGROUPS// /}" ]; then
              for NG in $NODEGROUPS; do
                echo "  Deleting node group: $NG"
                aws eks delete-nodegroup --cluster-name "$CLUSTER" --nodegroup-name "$NG" --region "$REGION" || true
                aws eks wait nodegroup-deleted --cluster-name "$CLUSTER" --nodegroup-name "$NG" --region "$REGION" || true
              done
            fi
          fi

          echo "=== Terraform destroy (removes state-tracked resources) ==="
          terraform plan -destroy -out=destroy.tfplan 2>&1 || true
          terraform apply -auto-approve destroy.tfplan 2>&1 || true

          # Remove OIDC provider from state (can cause destroy to hang)
          terraform state rm aws_iam_openid_connect_provider.eks 2>/dev/null || true

          echo "=== Cleaning up orphaned IAM roles/policies (if any) ==="
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws iam delete-role-policy --role-name "$VPC-$ENV-aws-load-balancer-controller-role" --policy-arn "arn:aws:iam::$ACCOUNT_ID:policy/$VPC-$ENV-AWSLoadBalancerControllerIAMPolicy" 2>/dev/null || true
          aws iam delete-policy --policy-arn "arn:aws:iam::$ACCOUNT_ID:policy/$VPC-$ENV-AWSLoadBalancerControllerIAMPolicy" 2>/dev/null || true
          aws iam detach-role-policy --role-name "$VPC-$ENV-ebs-csi-driver-role" --policy-arn "arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy" 2>/dev/null || true
          aws iam delete-role --role-name "$VPC-$ENV-ebs-csi-driver-role" 2>/dev/null || true
          aws iam delete-role --role-name "$VPC-$ENV-aws-load-balancer-controller-role" 2>/dev/null || true

          echo "=== Waiting for cluster to fully delete (if it existed) ==="
          aws eks wait cluster-deleted --name "$CLUSTER" --region "$REGION" 2>/dev/null || true

          echo "=== Teardown complete. State is now clean. ==="

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: terraform apply -auto-approve tfplan

      - name: Configure Ansible inventory
        shell: bash
        run: |
          NGINX_IP=$(cd terraform && terraform output -raw nginx_public_ip 2>/dev/null || echo "")
          if [ -z "$NGINX_IP" ]; then
            echo "Warning: nginx_public_ip output not found, trying instance_public_ip..."
            NGINX_IP=$(cd terraform && terraform output -raw instance_public_ip 2>/dev/null || echo "")
          fi
          echo "Nginx IP: $NGINX_IP"
          mkdir -p ansible
          {
            echo '[nginx]'
            echo "$NGINX_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/ansible_key.pem"
            echo ''
            echo '[nginx:vars]'
            echo 'ansible_python_interpreter=/usr/bin/python3'
            echo "aws_region=${{ secrets.AWS_REGION }}"
            echo "eks_cluster_name=${{ secrets.VPC_NAME }}-${{ steps.env.outputs.environment }}-cluster"
          } > ansible/hosts.ini
          echo "=== Generated hosts.ini ==="
          cat ansible/hosts.ini
          echo "==========================="

     

      - name: Save SSH private key
        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ansible_key.pem
          chmod 600 ~/.ssh/ansible_key.pem

      - name: Run Ansible playbook
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd ansible
          ansible-galaxy collection install kubernetes.core
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook -i hosts.ini playbook.yml -v \
            --extra-vars "aws_region=${{ secrets.AWS_REGION }} eks_cluster_name=${{ secrets.VPC_NAME }}-${{ steps.env.outputs.environment }}-cluster"

      - name: Print next steps
        shell: bash
        run: |
          echo "============================================"
          echo "  Infrastructure provisioned successfully!"
          echo "============================================"
          echo ""
          echo "Next steps:"
          echo "  Push to dev/test/prod branch to trigger Deploy Application workflow"
          echo "  Or run the Destroy workflow manually to tear down"
          echo ""
          echo "EKS Cluster: ${{ secrets.VPC_NAME }}-${{ steps.env.outputs.environment }}-cluster"
          echo "Region: ${{ secrets.AWS_REGION }}"
          echo "============================================"