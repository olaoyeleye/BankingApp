name: 1. Provision Infrastructure

on:
  push:
    branches: [ "dev", "test", "prod" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write



concurrency:
  group: infra-provision
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create terraform.tfvars
        working-directory: ./terraform
        shell: bash
        run: |
          cat > terraform.tfvars <<EOF
          region              = "${{ secrets.AWS_REGION }}"
          ami                 = "${{ secrets.AMI_ID }}"
          instance_type       = "${{ secrets.INSTANCE_TYPE }}"
          instance-name-nginx = "${{ secrets.INSTANCE_NAME_NGINX }}"
          vpc_name            = "${{ secrets.VPC_NAME }}"
          key_name            = "${{ secrets.KEY_NAME }}"
          EOF

      - name: Download AWS Load Balancer Controller IAM Policy
        working-directory: ./terraform
        shell: bash
        run: |
          curl -Lo iam_policy.json https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/main/docs/install/iam_policy.json

      - name: Terraform Init
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: terraform init -reconfigure

      - name: Import existing IAM resources (if they exist)
        working-directory: ./terraform
        shell: bash
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: |
          # Get account ID for policy ARN
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          VPC="${{ secrets.VPC_NAME }}"

          # Try importing existing IAM roles/policies - ignore errors (resource may not exist yet)
          terraform import aws_iam_role.eks_cluster "$VPC-eks-cluster-role" 2>/dev/null || true
          terraform import aws_iam_role.eks_nodes "$VPC-eks-node-role" 2>/dev/null || true
          terraform import aws_iam_role.ebs_csi_role "$VPC-ebs-csi-driver-role" 2>/dev/null || true
          terraform import aws_iam_role.aws_load_balancer_controller "$VPC-aws-load-balancer-controller-role" 2>/dev/null || true
          terraform import aws_iam_policy.aws_load_balancer_controller "arn:aws:iam::$ACCOUNT_ID:policy/$VPC-AWSLoadBalancerControllerIAMPolicy" 2>/dev/null || true

          # Try importing existing OIDC provider (if cluster already exists)
          OIDC_URL=$(aws eks describe-cluster --name "$VPC-cluster" --query cluster.identity.oidc.issuer --output text 2>/dev/null || echo "")
          if [ -n "$OIDC_URL" ] && [ "$OIDC_URL" != "None" ]; then
            OIDC_ARN=$(aws iam list-open-id-connect-providers --query "OpenIDConnectProviders[?Url=='$OIDC_URL'].Arn" --output text 2>/dev/null || echo "")
            if [ -n "$OIDC_ARN" ]; then
              terraform import aws_iam_openid_connect_provider.eks "$OIDC_ARN" 2>/dev/null || true
            fi
          fi

          # Try importing existing EKS cluster (if it exists)
          if aws eks describe-cluster --name "$VPC-cluster" >/dev/null 2>&1; then
            terraform import aws_eks_cluster.main "$VPC-cluster" 2>/dev/null || true
          fi

          echo "Import step complete - continuing with plan/apply"

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: terraform apply -auto-approve tfplan

      - name: Configure Ansible inventory
        shell: bash
        run: |
          NGINX_IP=$(cd terraform && terraform output -raw nginx_public_ip 2>/dev/null || echo "")
          if [ -z "$NGINX_IP" ]; then
            echo "Warning: nginx_public_ip output not found, trying instance_public_ip..."
            NGINX_IP=$(cd terraform && terraform output -raw instance_public_ip 2>/dev/null || echo "")
          fi
          echo "Nginx IP: $NGINX_IP"
          mkdir -p ansible
          cat > ansible/hosts.ini <<EOF
          [nginx]
          $NGINX_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/ansible_key.pem

          [nginx:vars]
          ansible_python_interpreter=/usr/bin/python3
          aws_region=${{ secrets.AWS_REGION }}
          eks_cluster_name=${{ secrets.VPC_NAME }}-cluster
          EOF



      - name: Save SSH private key
        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ansible_key.pem
          chmod 600 ~/.ssh/ansible_key.pem

      - name: Run Ansible playbook
        shell: bash
        run: |
          cd ansible
          ansible-galaxy collection install kubernetes.core
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook -i hosts.ini playbook.yml -v

      - name: Print next steps
        shell: bash
        run: |
          echo "============================================"
          echo "  Infrastructure provisioned successfully!"
          echo "============================================"
          echo ""
          echo "Next steps:"
          echo "  Push to dev/test/prod branch to trigger Deploy Application workflow"
          echo "  Or run the Destroy workflow manually to tear down"
          echo ""
          echo "EKS Cluster: ${{ secrets.VPC_NAME }}-cluster"
          echo "Region: ${{ secrets.AWS_REGION }}"
          echo "============================================"
