name: Deploy Infrastructure

on:
  push:
    branches: ["test", "dev", "prod"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - test
          - dev
          - prod
      terraform_action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  # Determine the environment from branch or manual input
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      terraform_action: ${{ steps.env.outputs.terraform_action }}
    steps:
      - name: Set environment from branch or input
        id: env
        shell: bash
        run: |
          # Determine environment
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="${GITHUB_REF##*/}"
          fi

          # Determine terraform action
          if [ -n "${{ github.event.inputs.terraform_action }}" ]; then
            ACTION="${{ github.event.inputs.terraform_action }}"
          else
            ACTION="apply"
          fi

          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "terraform_action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Deploying to environment: $ENV"
          echo "Terraform action: $ACTION"

  # Deploy job - uses GitHub Environments for approval gating
  deploy:
    needs: set-environment
    runs-on: ubuntu-latest
    # This maps to GitHub Environments configured in repo settings.
    # The 'prod' environment should have required reviewers configured.
    # 'test' and 'dev' environments can have no required reviewers for auto-approval.
    environment: ${{ needs.set-environment.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure environment variables
        id: config
        shell: bash
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          ACTION="${{ needs.set-environment.outputs.terraform_action }}"

          # Each environment gets its own state file key in S3
          STATE_KEY="banking-app/${ENV}/terraform.tfstate"
          echo "state_key=$STATE_KEY" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Environment: $ENV"
          echo "State key: $STATE_KEY"
          echo "Action: $ACTION"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        shell: bash
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create terraform.tfvars
        if: steps.config.outputs.action != 'destroy'
        working-directory: ./terraform
        shell: bash
        run: |
          cat > terraform.tfvars <<EOF
          region              = "${{ secrets.AWS_REGION }}"
          environment         = "${{ needs.set-environment.outputs.environment }}"
          ami                 = "${{ secrets.AMI_ID }}"
          instance_type       = "${{ secrets.INSTANCE_TYPE }}"
          instance-name-nginx = "${{ secrets.INSTANCE_NAME_NGINX }}"
          vpc_name            = "${{ secrets.VPC_NAME }}"
          key_name            = "${{ secrets.KEY_NAME }}"
          AWS_ACCOUNT_ID      = "${{ secrets.AWS_ACCOUNT_ID }}"
          EOF

      - name: Download AWS Load Balancer Controller IAM Policy
        if: steps.config.outputs.action != 'destroy'
        working-directory: ./terraform
        shell: bash
        run: |
          curl -Lo iam_policy.json https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/main/docs/install/iam_policy.json

      - name: Import Existing OIDC Provider if it exists
        if: steps.config.outputs.action != 'destroy'
        working-directory: ./terraform
        shell: bash
        run: |
          CLUSTER_NAME="${{ secrets.VPC_NAME }}-${{ needs.set-environment.outputs.environment }}-cluster"
          echo "Checking if EKS cluster '$CLUSTER_NAME' exists..."
          CLUSTER_EXISTS=$(aws eks list-clusters \
            --region "${{ secrets.AWS_REGION }}" \
            --query "clusters[?@=='${CLUSTER_NAME}']" \
            --output text)

          if [ -z "$CLUSTER_EXISTS" ]; then
            echo "Cluster '$CLUSTER_NAME' does not exist yet. Skipping OIDC import for fresh installation."
          else
            echo "Cluster found. Fetching OIDC Issuer URL..."
            OIDC_URL=$(aws eks describe-cluster \
              --name "$CLUSTER_NAME" \
              --region "${{ secrets.AWS_REGION }}" \
              --query "cluster.identity.oidc.issuer" \
              --output text)

            if [ -z "$OIDC_URL" ] || [[ ! "$OIDC_URL" =~ ^https:// ]]; then
              echo "ERROR: Received an invalid or empty OIDC URL: '$OIDC_URL'"
              exit 1
            fi

            ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
            PROVIDER_ARN="arn:aws:iam::$ACCOUNT_ID:oidc-provider/${OIDC_URL#https://}"

            if ! terraform state show aws_iam_openid_connect_provider.eks >/dev/null 2>&1; then
              terraform import aws_iam_openid_connect_provider.eks "$PROVIDER_ARN" || true
            fi
          fi

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -reconfigure -backend-config="key=${{ steps.config.outputs.state_key }}"

      - name: Delete EKS node groups first (for destroy)
        if: steps.config.outputs.action == 'destroy'
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER_NAME="${{ secrets.VPC_NAME }}-${{ needs.set-environment.outputs.environment }}-cluster"
          REGION="${{ secrets.AWS_REGION }}"

          if aws eks describe-cluster --name "$CLUSTER_NAME" --region "$REGION" >/dev/null 2>&1; then
            NODEGROUPS=$(aws eks list-nodegroups \
              --cluster-name "$CLUSTER_NAME" \
              --region "$REGION" \
              --query 'nodegroups[]' \
              --output text)

            if [ -n "${NODEGROUPS// /}" ]; then
              for NG in $NODEGROUPS; do
                aws eks delete-nodegroup \
                  --cluster-name "$CLUSTER_NAME" \
                  --nodegroup-name "$NG" \
                  --region "$REGION" || true

                aws eks wait nodegroup-deleted \
                  --cluster-name "$CLUSTER_NAME" \
                  --nodegroup-name "$NG" \
                  --region "$REGION" || true
              done
            fi
          fi

      - name: Terraform Apply Specifics (destroy partial)
        if: steps.config.outputs.action == 'destroy'
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: |
          helm uninstall ingress-nginx -n ingress-nginx || true
          terraform state rm helm_release.ingress_nginx || true
          terraform state rm kubernetes_namespace_v1.banking || true
          terraform state rm kubernetes_namespace_v1.ingress_nginx || true
          terraform state rm kubernetes_service_v1.bank_frontend || true
          terraform state rm helm_release.ebs_csi_driver || true
          terraform state rm aws_eks_node_group.main || true
          terraform state rm aws_iam_role.eks_controller_role || true
          terraform state rm aws_iam_policy.lb_controller_policy || true

          terraform apply \
            -target=aws_vpc.vpc \
            -target=aws_subnet.public_kunle_subnet_a \
            -target=aws_subnet.public_kunle_subnet_b \
            -target=aws_internet_gateway.kunle_igw \
            -target=aws_route_table.public_kunle_rt \
            -target=aws_route_table_association.public_subnet_1 \
            -target=aws_route_table_association.public_subnet_2 \
            -target=aws_security_group.public_kunle_sg \
            -target=aws_iam_role.eks_cluster \
            -target=aws_iam_role.eks_nodes \
            -target=aws_iam_role_policy_attachment.eks_cluster_policy \
            -target=aws_iam_role_policy_attachment.eks_worker_node_policy \
            -target=aws_iam_role_policy_attachment.eks_cni_policy \
            -target=aws_iam_role_policy_attachment.eks_registry_policy \
            -target=aws_eks_cluster.main \
            -target=aws_iam_openid_connect_provider.eks \
            -auto-approve

      - name: Terraform Plan
        if: steps.config.outputs.action != 'destroy'
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: steps.config.outputs.action != 'destroy'
        working-directory: ./terraform
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: terraform apply -auto-approve tfplan

      # ─── Application deployment (apply only) ────────────────────────────────

      - name: Install kubectl
        if: steps.config.outputs.action != 'destroy'
        shell: bash
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Login to Amazon ECR
        if: steps.config.outputs.action != 'destroy'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push image to ECR (User)
        if: steps.config.outputs.action != 'destroy'
        id: build-user-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: bank-app-user-service
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./techbleat-global-bank-backend
        shell: bash
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./user-service
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Build, Tag and Push image to ECR (Transaction)
        if: steps.config.outputs.action != 'destroy'
        id: build-transaction-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: bank-app-transaction-service
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./techbleat-global-bank-backend
        shell: bash
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./transaction-service
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Build, Tag and Push image to ECR (Activity)
        if: steps.config.outputs.action != 'destroy'
        id: build-activity-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: bank-app-activity-service
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./techbleat-global-bank-backend
        shell: bash
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./activity-service
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Build, Tag and Push image to ECR (Postgres Init)
        if: steps.config.outputs.action != 'destroy'
        id: build-postgres-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: bank-app-postgres
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./techbleat-global-bank-backend
        shell: bash
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./db-init
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Install Ansible
        if: steps.config.outputs.action != 'destroy'
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible boto3 botocore

      - name: Install eksctl
        if: steps.config.outputs.action != 'destroy'
        shell: bash
        run: |
          curl --silent --location \
            "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" \
            | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin

      - name: Get Nginx public IP
        if: steps.config.outputs.action != 'destroy'
        id: nginx-ip
        working-directory: ./terraform
        shell: bash
        run: |
          echo "NGINX_IP=$(terraform output -raw nginx_public_ip)" >> "$GITHUB_OUTPUT"

      - name: Save SSH private key
        if: steps.config.outputs.action != 'destroy'
        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          mkdir -p /home/runner/.ssh
          echo "$SSH_KEY" > /home/runner/.ssh/ansible_key.pem
          chmod 600 /home/runner/.ssh/ansible_key.pem

      - name: Wait for EC2 to be ready
        if: steps.config.outputs.action != 'destroy'
        shell: bash
        run: |
          for i in {1..12}; do
            ssh -i /home/runner/.ssh/ansible_key.pem \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              ec2-user@${{ steps.nginx-ip.outputs.NGINX_IP }} \
              "echo ready" && break
            sleep 15
          done

      - name: Map EC2 IAM identity inside EKS
        if: steps.config.outputs.action != 'destroy'
        shell: bash
        env:
          TF_VAR_eks_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.VPC_NAME }}-${{ needs.set-environment.outputs.environment }}-cluster" \
            --region "${{ secrets.AWS_REGION }}"

          eksctl create iamidentitymapping \
            --cluster "${{ secrets.VPC_NAME }}-${{ needs.set-environment.outputs.environment }}-cluster" \
            --region "${{ secrets.AWS_REGION }}" \
            --arn "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.VPC_NAME }}-ec2-eks-role" \
            --username ec2-eks-role \
            --group system:masters \
            --no-duplicate-arns

      - name: Create Ansible inventory
        if: steps.config.outputs.action != 'destroy'
        shell: bash
        run: |
          cat > ansible/hosts.ini <<EOF
          [nginx]
          nginx ansible_host=${{ steps.nginx-ip.outputs.NGINX_IP }}

          [nginx:vars]
          ansible_user=ec2-user
          ansible_ssh_private_key_file=/home/runner/.ssh/ansible_key.pem
          ansible_ssh_common_args='-o StrictHostKeyChecking=no -o IdentitiesOnly=yes'
          aws_region=${{ secrets.AWS_REGION }}
          eks_cluster_name=${{ secrets.VPC_NAME }}-${{ needs.set-environment.outputs.environment }}-cluster
          EOF

      - name: Run Ansible playbook (backend)
        if: steps.config.outputs.action != 'destroy'
        working-directory: ./ansible
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP }}
        shell: bash
        run: |
          ANSIBLE_CONFIG=ansible.cfg \
          ansible-playbook playbook.yml \
            --extra-vars "eks_cluster_name=${{ secrets.VPC_NAME }}-${{ needs.set-environment.outputs.environment }}-cluster" \
            --extra-vars "aws_region=${{ secrets.AWS_REGION }}" \
            --extra-vars "user_service_image=${{ steps.login-ecr.outputs.registry }}/bank-app-user-service:${{ github.sha }}" \
            --extra-vars "transaction_service_image=${{ steps.login-ecr.outputs.registry }}/bank-app-transaction-service:${{ github.sha }}" \
            --extra-vars "postgres_image=${{ steps.login-ecr.outputs.registry }}/bank-app-postgres:${{ github.sha }}" \
            --extra-vars "activity_service_image=${{ steps.login-ecr.outputs.registry }}/bank-app-activity-service:${{ github.sha }}"

      - name: Update frontend API endpoints
        if: steps.config.outputs.action != 'destroy'
        working-directory: ./techbleat-global-bank-frontend
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.VPC_NAME }}-${{ needs.set-environment.outputs.environment }}-cluster" \
            --region "${{ secrets.AWS_REGION }}"

          INGRESS_HOST=""
          for i in {1..20}; do
            INGRESS_HOST=$(kubectl -n banking get ingress banking-ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$INGRESS_HOST" ]; then
              break
            fi
            echo "Attempt $i: ingress host not ready, waiting 15s..."
            sleep 15
          done

          if [ -z "$INGRESS_HOST" ]; then
            echo "Ingress host is empty"
            kubectl -n banking get ingress
            exit 1
          fi

          sed -i "s|INGRESS_HOST|${INGRESS_HOST}|g" src/App.jsx
          cat src/App.jsx | head -n 10

      - name: Build, Tag and Push frontend image to ECR
        if: steps.config.outputs.action != 'destroy'
        id: build-frontend-service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: bank-app-frontend
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./techbleat-global-bank-frontend
        shell: bash
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Run Ansible playbook (frontend)
        if: steps.config.outputs.action != 'destroy'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          ANSIBLE_CONFIG=ansible/ansible.cfg \
          ansible-playbook ansible/playbook_frontend.yml \
            --extra-vars "eks_cluster_name=${{ secrets.VPC_NAME }}-${{ needs.set-environment.outputs.environment }}-cluster" \
            --extra-vars "aws_region=${{ secrets.AWS_REGION }}" \
            --extra-vars "frontend_service_image=${{ steps.login-ecr.outputs.registry }}/bank-app-frontend:${{ github.sha }}"

      - name: Get Ingress URL
        if: steps.config.outputs.action != 'destroy'
        id: get-ingress-url
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.VPC_NAME }}-${{ needs.set-environment.outputs.environment }}-cluster" \
            --region "${{ secrets.AWS_REGION }}"

          echo "Waiting for Ingress ALB address..."
          INGRESS_ALB=""
          for i in {1..20}; do
            INGRESS_ALB=$(kubectl -n banking get ingress banking-ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$INGRESS_ALB" ]; then
              break
            fi
            echo "Attempt $i: Ingress ALB not assigned yet, waiting 20s..."
            sleep 20
          done

          echo "alb_url=$INGRESS_ALB" >> "$GITHUB_OUTPUT"
          echo "Ingress ALB URL: $INGRESS_ALB"

      - name: Copy manifest repo to EC2
        if: steps.config.outputs.action != 'destroy'
        shell: bash
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='terraform/.terraform' \
            --exclude='terraform/tfplan' \
            -e "ssh -i /home/runner/.ssh/ansible_key.pem -o StrictHostKeyChecking=no" \
            ${{ github.workspace }}/ \
            ec2-user@${{ steps.nginx-ip.outputs.NGINX_IP }}:/home/ec2-user/manifest-repo/