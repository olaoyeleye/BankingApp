name: Deploy Application

on:
  push:
    branches: [ "test", "dev", "prod" ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - test
          - dev
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: "${{ steps.env.outputs.environment }}"
    steps:
      - name: Set environment from branch or input
        id: env
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="${GITHUB_REF##*/}"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "Deploying to environment: $ENV (namespace: banking-$ENV)"

  build-images:
    needs: set-environment
    runs-on: ubuntu-latest
    environment: "${{ needs.set-environment.outputs.environment }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws-region: "${{ secrets.AWS_REGION }}"
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & Push (User Service)
        env:
          ECR_REGISTRY: "${{ steps.login-ecr.outputs.registry }}"
          IMAGE_TAG: "${{ github.sha }}"
        working-directory: ./techbleat-global-bank-backend
        shell: bash
        run: |
          docker build -t "$ECR_REGISTRY/bank-app-user-service:$IMAGE_TAG" ./user-service
          docker push "$ECR_REGISTRY/bank-app-user-service:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/bank-app-user-service:$IMAGE_TAG" "$ECR_REGISTRY/bank-app-user-service:latest"
          docker push "$ECR_REGISTRY/bank-app-user-service:latest"
      - name: Build & Push (Transaction Service)
        env:
          ECR_REGISTRY: "${{ steps.login-ecr.outputs.registry }}"
          IMAGE_TAG: "${{ github.sha }}"
        working-directory: ./techbleat-global-bank-backend
        shell: bash
        run: |
          docker build -t "$ECR_REGISTRY/bank-app-transaction-service:$IMAGE_TAG" ./transaction-service
          docker push "$ECR_REGISTRY/bank-app-transaction-service:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/bank-app-transaction-service:$IMAGE_TAG" "$ECR_REGISTRY/bank-app-transaction-service:latest"
          docker push "$ECR_REGISTRY/bank-app-transaction-service:latest"
      - name: Build & Push (Activity Service)
        env:
          ECR_REGISTRY: "${{ steps.login-ecr.outputs.registry }}"
          IMAGE_TAG: "${{ github.sha }}"
        working-directory: ./techbleat-global-bank-backend
        shell: bash
        run: |
          docker build -t "$ECR_REGISTRY/bank-app-activity-service:$IMAGE_TAG" ./activity-service
          docker push "$ECR_REGISTRY/bank-app-activity-service:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/bank-app-activity-service:$IMAGE_TAG" "$ECR_REGISTRY/bank-app-activity-service:latest"
          docker push "$ECR_REGISTRY/bank-app-activity-service:latest"
      - name: Build & Push (Postgres Init)
        env:
          ECR_REGISTRY: "${{ steps.login-ecr.outputs.registry }}"
          IMAGE_TAG: "${{ github.sha }}"
        working-directory: ./techbleat-global-bank-backend
        shell: bash
        run: |
          docker build -t "$ECR_REGISTRY/bank-app-postgres:$IMAGE_TAG" ./db-init
          docker push "$ECR_REGISTRY/bank-app-postgres:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/bank-app-postgres:$IMAGE_TAG" "$ECR_REGISTRY/bank-app-postgres:latest"
          docker push "$ECR_REGISTRY/bank-app-postgres:latest"
      - name: Update frontend API endpoints
        working-directory: ./techbleat-global-bank-frontend
        shell: bash
        run: |
          aws eks update-kubeconfig --name "${{ secrets.VPC_NAME }}-cluster" --region "${{ secrets.AWS_REGION }}"
          NAMESPACE="banking-${{ needs.set-environment.outputs.environment }}"
          INGRESS_HOST=""
          for i in {1..20}; do
            INGRESS_HOST=$(kubectl -n "$NAMESPACE" get ingress banking-ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$INGRESS_HOST" ]; then break; fi
            echo "Attempt $i: ingress host not ready, waiting 15s..."
            sleep 15
          done
          if [ -z "$INGRESS_HOST" ]; then echo "Ingress host is empty"; exit 1; fi
          sed -i "s|INGRESS_HOST|${INGRESS_HOST}|g" src/App.jsx
      - name: Build & Push (Frontend)
        env:
          ECR_REGISTRY: "${{ steps.login-ecr.outputs.registry }}"
          IMAGE_TAG: "${{ github.sha }}"
        working-directory: ./techbleat-global-bank-frontend
        shell: bash
        run: |
          docker build -t "$ECR_REGISTRY/bank-app-frontend:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/bank-app-frontend:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/bank-app-frontend:$IMAGE_TAG" "$ECR_REGISTRY/bank-app-frontend:latest"
          docker push "$ECR_REGISTRY/bank-app-frontend:latest"

  deploy-helm:
    needs: [ set-environment, build-images ]
    runs-on: ubuntu-latest
    environment: "${{ needs.set-environment.outputs.environment }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws-region: "${{ secrets.AWS_REGION }}"
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Install kubectl
        shell: bash
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      - name: Install Helm
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Update kubeconfig
        shell: bash
        run: aws eks update-kubeconfig --name "${{ secrets.VPC_NAME }}-cluster" --region "${{ secrets.AWS_REGION }}"
      - name: Deploy Helm chart
        shell: bash
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_TAG="${{ github.sha }}"
          NAMESPACE="banking-${ENV}"
          echo "Deploying banking-app to namespace: $NAMESPACE"
          helm upgrade --install banking-app ./helm/banking-app \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f ./helm/banking-app/values.yaml \
            -f ./helm/banking-app/values-${ENV}.yaml \
            --set ecrRegistry="$ECR_REGISTRY" \
            --set imageTag="$IMAGE_TAG" \
            --wait --timeout 5m
      - name: Get Ingress URL
        shell: bash
        run: |
          NAMESPACE="banking-${{ needs.set-environment.outputs.environment }}"
          INGRESS_ALB=""
          for i in {1..20}; do
            INGRESS_ALB=$(kubectl -n "$NAMESPACE" get ingress banking-ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$INGRESS_ALB" ]; then break; fi
            sleep 20
          done
          echo "Application deployed! Ingress URL: $INGRESS_ALB"

  sync-ec2:
    needs: [ set-environment, deploy-helm ]
    runs-on: ubuntu-latest
    environment: "${{ needs.set-environment.outputs.environment }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws-secret-access-key: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws-region: "${{ secrets.AWS_REGION }}"
      - name: Get Nginx public IP
        id: nginx-ip
        working-directory: ./terraform
        shell: bash
        run: |
          terraform init -reconfigure -backend=false 2>/dev/null || true
          echo "NGINX_IP=$(terraform output -raw nginx_public_ip 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
      - name: Save SSH private key
        env:
          SSH_KEY: "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}"
        shell: bash
        run: |
          mkdir -p /home/runner/.ssh
          echo "$SSH_KEY" > /home/runner/.ssh/ansible_key.pem
          chmod 600 /home/runner/.ssh/ansible_key.pem
      - name: Copy manifest repo to EC2
        if: steps.nginx-ip.outputs.NGINX_IP != ''
        shell: bash
        run: |
          rsync -avz --exclude='.git' --exclude='node_modules' --exclude='.github' --exclude='terraform/.terraform' --exclude='terraform/tfplan' -e "ssh -i /home/runner/.ssh/ansible_key.pem -o StrictHostKeyChecking=no" ${{ github.workspace }}/ ec2-user@"${{ steps.nginx-ip.outputs.NGINX_IP }}":/home/ec2-user/manifest-repo/